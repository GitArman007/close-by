server:
  port: ${PORT:8080}
  forward-headers-strategy: native

spring:
  application:
    name: closeby-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/closeby}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

closeby:
  jwt:
    # Provide a 256-bit+ secret via JWT_SECRET env var in deployed environments
    secret: ${JWT_SECRET:closeby-lncts-bhopal-dev-jwt-secret-key-at-least-32-bytes-long-2026}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000}
  seed:
    enabled: ${CLOSEBY_SEED_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
