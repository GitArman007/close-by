spring:
  datasource:
    url: jdbc:h2:mem:closeby_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

closeby:
  jwt:
    secret: closeby-integration-test-jwt-secret-key-minimum-32-bytes-2026
    expiration-seconds: 3600
  seed:
    enabled: false
