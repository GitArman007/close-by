services:
  postgres:
    image: postgres:16-alpine
    container_name: closeby-postgres
    environment:
      POSTGRES_DB: closeby
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - closeby_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d closeby"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  closeby_pgdata:
